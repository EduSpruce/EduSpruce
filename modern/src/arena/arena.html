<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1424">
<meta name="robots" content="noindex">
<title>EduSpruce Arena</title>
<link rel="icon" href="favicon.png">
<style>
:root{--bg:#0b1424;--panel:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);--ink:#f1f5f9;--mut:#9fb3c8;--acc:#22b8e0;--ok:#22c55e;--bad:#ef4444;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:radial-gradient(900px 600px at 10% -10%,#1d4f6e 0,transparent 60%),radial-gradient(700px 500px at 110% 110%,#3b1d5e 0,transparent 55%),var(--bg);background-attachment:fixed;color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:max(12px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));overscroll-behavior:none}
#app{max-width:640px;margin:0 auto;min-height:calc(100dvh - 30px);display:flex;flex-direction:column}
header.top{display:flex;align-items:center;gap:10px;margin:0 0 12px}
header.top b{font-size:16px;letter-spacing:.01em}header.top b em{font-style:normal;color:#facc15}
header.top .sp{flex:1}
.ib{all:unset;cursor:pointer;width:40px;height:40px;border-radius:12px;background:var(--panel);display:grid;place-items:center;font-size:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:0 0 12px}
h1{font-size:26px;margin:0 0 6px;line-height:1.15}h2{font-size:20px;margin:0 0 6px}p{margin:0 0 10px}.mut{color:var(--mut)}
label{display:block;font-weight:700;margin:14px 0 6px}
input{width:100%;font:inherit;font-size:18px;color:#0b1424;background:#fff;border:0;border-radius:14px;padding:14px 16px;min-height:54px}
input:focus{outline:4px solid rgba(34,184,224,.5)}
#cod{font:800 30px/1 ui-monospace,Menlo,monospace;letter-spacing:.22em;text-transform:uppercase;text-align:center}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border-radius:16px;background:linear-gradient(180deg,#26c3ec,#1690b8);color:#fff;font-weight:800;font-size:18px;margin-top:14px;box-shadow:0 5px 0 #0e6f8f;text-align:center;padding:0 16px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #0e6f8f}.btn[disabled]{opacity:.6;pointer-events:none}
.btn.sec{background:rgba(255,255,255,.12);box-shadow:none}.btn.ouro{background:linear-gradient(180deg,#fbbf24,#d97706);box-shadow:0 5px 0 #92400e}
.err{color:#fecaca;background:rgba(239,68,68,.18);border-radius:12px;padding:10px 12px;font-weight:600;margin:12px 0 0}.err:empty{display:none}
.row{display:flex;gap:8px;align-items:center}
.lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;max-height:52vh;overflow:auto;padding:2px}
.lista button{all:unset;cursor:pointer;background:rgba(255,255,255,.1);border-radius:14px;padding:12px;font-weight:700;text-align:left}.lista button.on{background:var(--acc);color:#04202b}
.avs{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.avs button{all:unset;cursor:pointer;border-radius:14px;padding:4px;display:grid;place-items:center;background:rgba(255,255,255,.06);position:relative}.avs button.on{background:rgba(250,204,21,.25);outline:3px solid #facc15}
.avs button[disabled]{opacity:.22;filter:grayscale(1);cursor:default}.avs small{position:absolute;right:4px;bottom:2px;font-size:11px;font-weight:800}
.lob{text-align:center;margin:auto 0;padding:20px 0}.lob .av{animation:salta 1.6s ease-in-out infinite}
.lob h1{font-size:30px}.dots span{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--acc);margin:0 4px;animation:pt 1.2s infinite}.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
.hud{display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:16px;padding:6px 10px 6px 6px;margin-bottom:12px}
.hud b{font-size:17px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.hud .sp{display:none}.hud .sp{flex:1}.hud .pill{background:rgba(255,255,255,.12);border-radius:999px;padding:5px 11px;font-weight:800;font-size:15px;white-space:nowrap}
.hud .pill.t{font-variant-numeric:tabular-nums}.hud .pill.t.pouco{background:rgba(239,68,68,.4)}
.q{display:flex;flex-direction:column;flex:1;gap:12px}
.qt{font-size:clamp(20px,5.4vw,28px);font-weight:800;text-align:center;line-height:1.25;background:#fff;color:#0b1424;border-radius:var(--r);padding:18px 14px}
.qi{max-width:100%;max-height:30vh;object-fit:contain;border-radius:14px;align-self:center;background:#fff}
.bar{height:7px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#22d3ee,#a78bfa);transition:width .25s linear}
.ops{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:auto}
.op{all:unset;box-sizing:border-box;cursor:pointer;background:var(--oc);border-radius:18px;min-height:clamp(90px,17vh,150px);padding:14px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;font-weight:800;font-size:clamp(15px,4.2vw,21px);box-shadow:0 6px 0 rgba(0,0,0,.28);color:#fff;word-break:break-word}
.op span{font-size:24px;opacity:.9}.op:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
.op.esc{outline:5px solid #fff}.op.sombra{opacity:.35}.op.certa{outline:5px solid #fff;animation:pulso .6s}
.fb{margin:auto 0;text-align:center;padding:24px 0}.fb .ic{font-size:76px;line-height:1;animation:pop .5s cubic-bezier(.2,1.4,.3,1)}
.fb h1{font-size:34px;margin-top:10px}.fb.ok h1{color:#86efac}.fb.no h1{color:#fca5a5}
.fb .pts{font-size:28px;font-weight:900;color:#facc15}
.pinhas3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.pinhas3 button{all:unset;cursor:pointer;border-radius:20px;background:rgba(255,255,255,.08);padding:12px 4px;display:grid;place-items:center;transition:transform .2s}
.pinhas3 button:hover,.pinhas3 button:focus-visible{transform:translateY(-6px) rotate(-3deg);background:rgba(250,204,21,.18)}
.pinhas3 button.abre{animation:abre .7s forwards}.pinhas3 .res{font-weight:800;font-size:14px;text-align:center;padding:4px}
.efeito{font-size:30px;font-weight:900;text-align:center;animation:pop .5s cubic-bezier(.2,1.4,.3,1)}
.flo{display:grid;place-items:center;margin:8px 0}.flo svg{width:min(70vw,300px);height:auto}.arbro{animation:cresce .9s cubic-bezier(.2,1.3,.3,1);transform-box:fill-box;transform-origin:50% 100%}
.top5{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.top5 div{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);border-radius:12px;padding:4px 10px 4px 4px}.top5 div.eu{background:rgba(34,184,224,.25)}
.top5 b{width:22px;text-align:center;color:#facc15}.top5 span{flex:1;text-align:left;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.top5 em{font-style:normal;font-weight:800}
.fim{text-align:center}.fim .pos{font-size:64px;font-weight:900;color:#facc15;line-height:1}
.sacos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.sacos button{all:unset;cursor:pointer;border-radius:16px;padding:12px 6px;text-align:center;background:var(--sc);box-shadow:0 5px 0 rgba(0,0,0,.3)}.sacos button[disabled]{opacity:.4}
.sacos b{display:block;font-size:15px}.sacos span{font-size:13px;font-weight:700}.sacos i{font-style:normal;font-size:30px;display:block}
.novo{text-align:center;padding:10px 0}.novo .nm{font-size:24px;font-weight:900}.novo svg{animation:gira 1s cubic-bezier(.2,1.3,.3,1)}
.rar{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:900;color:#fff}
.pausa{position:fixed;inset:0;background:rgba(11,20,36,.82);display:grid;place-items:center;font-size:32px;font-weight:900;z-index:5;backdrop-filter:blur(4px)}
.arcf{position:fixed;top:-10px;width:9px;height:14px;border-radius:2px;animation:arcai linear forwards;pointer-events:none;z-index:9}
.peq{font-size:13px}.centro{text-align:center}
.lig{position:fixed;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom));background:#7f1d1d;color:#fff;border-radius:999px;padding:6px 14px;font-weight:700;font-size:13px;z-index:8}
@keyframes arcai{to{top:110%;transform:translateX(40px) rotate(720deg)}}
@keyframes salta{50%{transform:translateY(-10px) rotate(3deg)}}
@keyframes pt{50%{opacity:.25;transform:scale(.7)}}
@keyframes pop{from{transform:scale(.3);opacity:0}}
@keyframes pulso{50%{transform:scale(1.04)}}
@keyframes abre{40%{transform:scale(1.15) rotate(8deg)}100%{transform:scale(1)}}
@keyframes cresce{from{transform:scale(0)}}
@keyframes gira{from{transform:rotateY(540deg) scale(.3)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.esc{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.esc button{all:unset;cursor:pointer;position:relative;border-radius:20px;background:rgba(255,255,255,.08);padding:16px 4px 10px;display:grid;place-items:center;min-height:96px;transition:transform .2s,background .2s;overflow:hidden}
.esc button:hover,.esc button:focus-visible{transform:translateY(-5px);background:rgba(250,204,21,.18)}.esc button.abre{animation:abre .7s forwards}.esc button.esc-eu{box-shadow:0 0 0 3px #facc15;transform:scale(1.04)}
.esc .eic{font-size:52px;line-height:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}.esc .res{font-weight:800;font-size:13px;text-align:center;padding:4px 2px 0}
.esc.mina{gap:8px}.esc.mina button{min-height:82px;background:linear-gradient(160deg,#78350f,#451a03);border-radius:14px}.esc.mina .eic{font-size:44px}
.esc.ceu{background:radial-gradient(circle at 30% 20%,#312e81,#0b1026);border-radius:22px;padding:16px}.esc.ceu button{background:rgba(255,255,255,.06)}.esc.ceu .eic{animation:brilha 1.6s ease-in-out infinite}.esc.ceu button:nth-child(2) .eic{animation-delay:.4s}.esc.ceu button:nth-child(3) .eic{animation-delay:.8s}
@keyframes brilha{50%{transform:scale(1.15) rotate(8deg);filter:drop-shadow(0 0 12px #fde047)}}
.esc.garra{background:linear-gradient(#fbcfe8,#f9a8d4);border:5px solid #db2777;border-radius:22px;padding:30px 12px 12px}.esc.garra button{background:rgba(255,255,255,.55);padding-top:30px}.esc.garra .claw{position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-style:normal;font-size:26px;transition:top .6s cubic-bezier(.3,1.4,.5,1)}.esc.garra button.abre .claw,.esc.garra button.esc-eu .claw{top:30px}.esc.garra .res{color:#831843}
.esc.cofres button{background:linear-gradient(160deg,#134e4a,#042f2e);border:2px solid #14b8a6}
.efeito .efic{font-size:56px;display:inline-block;animation:pop .5s cubic-bezier(.2,1.4,.3,1)}.efeito small{font-size:18px;opacity:.9}
.lasops{display:grid;gap:10px;margin:14px 0}.lasb{all:unset;cursor:pointer;display:grid;grid-template-columns:52px 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;padding:12px 14px;border-radius:18px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.12);transition:transform .15s}
.lasb span{grid-row:1/3;font-size:36px;text-align:center}.lasb b{font-size:18px}.lasb small{opacity:.75;font-size:13px}.lasb:hover:not([disabled]){transform:translateX(4px);border-color:#facc15}.lasb[disabled]{opacity:.4;cursor:default}.lasb.sombra{opacity:.35}
.lasb.dis{border-color:#22c55e}.lasb.esc_{border-color:#38bdf8}.lasb.car{border-color:#facc15}
.alvos{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:6px}.alvos button{all:unset;cursor:pointer;display:grid;justify-items:center;gap:2px;padding:10px 6px;border-radius:16px;background:rgba(255,255,255,.08);border:2px solid transparent}.alvos button:hover{border-color:#ef4444}.alvos b{font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.alvos em{font-style:normal;font-size:12px;opacity:.75}
.alvos button.zap{animation:zap .5s 3;border-color:#ef4444}.alvos button.bloq{border-color:#38bdf8;box-shadow:0 0 0 4px rgba(56,189,248,.35)}@keyframes zap{50%{background:rgba(239,68,68,.45)}}
.col-h{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.favo{display:grid;justify-items:center;padding:10px 4px;border-radius:16px;background:linear-gradient(160deg,rgba(250,204,21,.25),rgba(202,138,4,.12));font-size:28px}.favo b{font-size:22px}.favo small{font-size:12px;opacity:.8}
.fb.lago{background:linear-gradient(#0c4a6e,#082f49);border-radius:24px;padding:20px 12px}.fb .peixe{animation:salta 1s cubic-bezier(.2,1.4,.3,1);filter:drop-shadow(0 8px 10px rgba(0,0,0,.4))}@keyframes salta{0%{transform:translateY(80px) rotate(-40deg);opacity:0}60%{transform:translateY(-16px) rotate(10deg);opacity:1}}
.pista{position:relative;margin:16px 0;padding:8px 26px 8px 8px;border-radius:18px;background:#334155;display:grid;gap:6px}.pista .faixa{position:relative;height:44px;border-radius:10px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 28px,rgba(255,255,255,.02) 28px 56px)}.pista .faixa.eu{box-shadow:inset 0 0 0 2px #facc15}
.pista .lin{position:absolute;left:0;right:0;top:50%;border-top:2px dashed rgba(255,255,255,.18)}.pista .car{position:absolute;top:50%;transform:translate(-10%,-50%);transition:left .8s cubic-bezier(.2,.8,.2,1)}.pista .faixa b{position:absolute;right:6px;bottom:2px;font-size:11px;opacity:.7}.pista .meta{position:absolute;right:4px;top:50%;transform:translateY(-50%);font-size:22px}
@media (prefers-reduced-motion:reduce){.esc .eic,.fb .peixe,.alvos button.zap{animation:none!important}}
</style>

<body>
<div id="app"><div class="lob"><p class="mut">A abrir…</p></div></div>
<script>window.__ES_SB="__ES_SB__";</script>
<script>
/*ARENA_COMUM*/
</script>
<script>
(()=>{const AR=window.ARENA;const $=s=>document.querySelector(s);const app=$('#app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CORES=['#e2453c','#1f7fd0','#e9a400','#2f9e44'],FORMAS=['▲','◆','●','■'];
let CFG=null;const st={};let tPoll=null,tRel=null,canal=null,ocupado=false,ecraAtual='';
async function cfg(){if(CFG)return CFG;let c=window.__ES_SB;if(!c||typeof c!=='object'){try{c=await (await fetch('supabase-config.json',{cache:'no-store'})).json()}catch(_){c=null}}if(!c||!c.url)throw new Error('A Arena não está configurada.');CFG=c;return c}
async function rpc(fn,args){const c=await cfg();let r;try{r=await fetch(c.url+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'Content-Type':'application/json',apikey:c.anonKey,Authorization:'Bearer '+c.anonKey},body:JSON.stringify(args)})}catch(e){const x=new Error('Sem ligação. A tentar de novo…');x.rede=true;throw x}
  if(!r.ok){const t=await r.text();const x=new Error(r.status===404?'A Arena ainda não está disponível nesta escola.':'Erro do servidor ('+r.status+').');x.http=r.status;x.det=t;throw x}return r.json()}
const MSG={sala:'Não encontrei essa sala, ou o jogo já terminou. Confirma o código.',limite:'O prazo deste trabalho de casa já passou.',alcunha:'A alcunha precisa de 2 a 24 carateres.',impropria:'Essa alcunha não pode ser usada. Escolhe outra.',
  emuso:'Esse nome já está a ser usado por outro aparelho. Se és tu, espera uns segundos e tenta de novo.',tardia:'O jogo já começou e o professor não deixa entrar depois do início.',cheia:'A sala está cheia.',expulso:'O professor tirou-te deste jogo.',lista:'Escolhe o teu nome na lista.',pedido:'Pedido inválido.'};
const guardar=()=>{try{localStorage.setItem('arena.'+st.id,JSON.stringify({j:st.j,tok:st.tok,alcunha:st.alcunha,ref:st.ref||null,code:st.code}))}catch(_){}};
const lerG=id=>{try{return JSON.parse(localStorage.getItem('arena.'+id)||'null')}catch(_){return null}};
const esquecer=()=>{try{localStorage.removeItem('arena.'+st.id)}catch(_){}};
const topo=(extra)=>`<header class="top">${AR.svg('p16',34)}<b>EduSpruce <em>Arena</em></b><span class="sp"></span>${extra||''}<button class="ib" id="b-som" aria-label="Som">${AR.som?'🔔':'🔕'}</button></header>`;
const ligarSom=()=>{const b=$('#b-som');if(b)b.onclick=()=>{AR.som=!AR.som;b.textContent=AR.som?'🔔':'🔕';try{localStorage.setItem('arena.som',AR.som?'1':'0')}catch(_){}}};
try{AR.som=localStorage.getItem('arena.som')!=='0'}catch(_){}
function ecra(nome,html){ecraAtual=nome;app.innerHTML=html;ligarSom();window.scrollTo(0,0)}
let ligInd=null;const semRede=v=>{if(v&&!ligInd){ligInd=document.createElement('div');ligInd.className='lig';ligInd.textContent='Sem ligação · a tentar de novo…';document.body.appendChild(ligInd)}if(!v&&ligInd){ligInd.remove();ligInd=null}};

/* ---------- 1. código ---------- */
function ecraCodigo(msg,cod){paraTudo();ecra('codigo',`${topo()}<div class="card" style="margin-top:auto"><h1>Entra no jogo</h1><p class="mut">Escreve o código que está no quadro.</p><input id="cod" maxlength="7" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text" value="${esc(AR.fmt(cod||''))}" aria-label="Código da sala"><button class="btn" id="b-ok">Entrar</button><p class="err" id="e">${esc(msg||'')}</p></div><p class="mut centro peq" style="margin-bottom:auto">Não precisas de conta. Só guardamos a tua alcunha e as tuas respostas durante o jogo.</p>`);
  const i=$('#cod');i.oninput=()=>{const p=i.selectionStart;i.value=AR.fmt(AR.limpaCod(i.value));};i.onkeydown=e=>{if(e.key==='Enter')$('#b-ok').click()};if(!cod)setTimeout(()=>i.focus(),100);
  $('#b-ok').onclick=()=>abrir(AR.limpaCod(i.value))}
async function abrir(code){const e=$('#e'),b=$('#b-ok');if(code.length!==6){if(e)e.textContent='O código tem 6 carateres.';return}if(b){b.disabled=true;b.textContent='A procurar…'}
  try{st.code=code;st.id=await AR.salaId(code);history.replaceState(null,'','#'+code);
    const g=lerG(st.id);if(g&&g.j&&g.tok){Object.assign(st,g);const r=await rpc('arena_estado',{p_id:st.id,p_j:st.j,p_tok:st.tok});if(r&&!r.erro&&!r.eu.expulso){st.alcunha=r.eu.alcunha;comecar(r);return}esquecer()}
    const info=await rpc('arena_info',{p_id:st.id});if(!info){if(b){b.disabled=false;b.textContent='Entrar'}if(e)e.textContent=MSG.sala;return}st.info=info;ecraNome()}
  catch(x){if(b){b.disabled=false;b.textContent='Entrar'}if(e)e.textContent=x.message}}

/* ---------- 2. nome / alcunha + avatar ---------- */
async function ecraNome(){const I=st.info;const lista=I.cfg&&I.cfg.nomes==='lista';st.avatar=st.avatar||AR.COMUNS[Math.floor(Math.random()*AR.COMUNS.length)];
  let L=[];if(lista){try{L=await AR.decifrar(I.cfg.lista_c,st.code)}catch(_){return ecraCodigo('Não foi possível abrir a lista da turma. Confirma o código.',st.code)}}
  ecra('nome',`${topo()}<div class="card"><p class="mut" style="margin:0">${esc(I.cfg.titulo||'Jogo')} · ${esc((AR.MODOS[I.modo]||{}).nome||'')}${I.tipo==='tpc'?' · trabalho de casa':''}</p><h1>${lista?'Quem és?':'Escolhe uma alcunha'}</h1>
    ${lista?`<div class="lista" id="lst">${L.map((x,k)=>`<button type="button" data-k="${k}">${esc(x.n)}</button>`).join('')}</div>`:`<div class="row"><input id="alc" maxlength="24" autocomplete="off" placeholder="A tua alcunha" aria-label="Alcunha"><button class="ib" id="b-dado" type="button" aria-label="Sugerir alcunha" style="flex:none;width:54px;height:54px;font-size:24px">🎲</button></div><p class="mut peq" style="margin:6px 0 0">Não uses o teu nome verdadeiro se não quiseres. Palavras impróprias são recusadas.</p>`}
    <label>A tua Pinha</label><div class="avs" id="avs">${AR.COMUNS.map(id=>`<button type="button" data-av="${id}" class="${st.avatar===id?'on':''}" aria-label="${esc(AR.pinha(id).nome)}">${AR.svg(id,56)}</button>`).join('')}</div>
    <button class="btn" id="b-ent">Entrar no jogo</button><p class="err" id="e"></p></div>`);
  let esc_=null;if(lista)document.querySelectorAll('#lst [data-k]').forEach(b=>b.onclick=()=>{esc_=L[+b.dataset.k];document.querySelectorAll('#lst [data-k]').forEach(z=>z.classList.toggle('on',z===b))});
  else{const a=$('#alc');a.value=st.alcunha||'';$('#b-dado').onclick=()=>{a.value=AR.SUGESTOES[Math.floor(Math.random()*AR.SUGESTOES.length)]+' '+(10+Math.floor(Math.random()*90))};a.onkeydown=e=>{if(e.key==='Enter')$('#b-ent').click()}}
  document.querySelectorAll('#avs [data-av]').forEach(b=>b.onclick=()=>{st.avatar=b.dataset.av;document.querySelectorAll('#avs [data-av]').forEach(z=>z.classList.toggle('on',z===b))});
  $('#b-ent').onclick=async()=>{const e=$('#e'),b=$('#b-ent');let alc,ref=null;if(lista){if(!esc_){e.textContent=MSG.lista;return}{const w=esc_.n.replace(/^\d+\.\s*/,'').split(/\s+/);alc=w[0]+(w.length>1?' '+w[w.length-1][0]+'.':'')}ref=esc_.r}else{alc=$('#alc').value.trim().replace(/\s+/g,' ');const m=AR.alcunhaOk(alc);if(m){e.textContent=m;return}}
    b.disabled=true;b.textContent='A entrar…';st.tok=st.tok||AR.token();
    try{const r=await rpc('arena_entrar',{p_id:st.id,p_alcunha:alc,p_tok:st.tok,p_ref:ref,p_avatar:st.avatar});if(!r||r.erro){b.disabled=false;b.textContent='Entrar no jogo';e.textContent=MSG[r&&r.erro]||'Não foi possível entrar.';return}
      st.j=r.j;st.alcunha=r.alcunha;st.ref=ref;guardar();AR.tocar('entra');AR.vibrar(30);const s=await rpc('arena_estado',{p_id:st.id,p_j:st.j,p_tok:st.tok});comecar(s)}
    catch(x){b.disabled=false;b.textContent='Entrar no jogo';e.textContent=x.message}}}

/* ---------- 3. ciclo do jogo ---------- */
function paraTudo(){clearTimeout(tPoll);clearInterval(tRel);tPoll=tRel=null;try{canal&&canal.unsubscribe()}catch(_){}canal=null}
async function ligarCanal(){try{const c=await cfg();const m=await import('./esm/supabase-2.117.3.min.js');const sb=m.createClient(c.url,c.anonKey,{auth:{persistSession:false,autoRefreshToken:false}});canal=sb.channel('arena-'+st.id,{config:{broadcast:{self:false}}});
  canal.on('broadcast',{event:'s'},()=>{clearTimeout(st.tAviso);st.tAviso=setTimeout(atualizar,120+Math.random()*450)}).subscribe()}catch(_){}}
function comecar(r){paraTudo();st.estado=r;st.livre=false;st.qAtual=null;ligarCanal();aplicar(r);agendar()}
function agendar(){clearTimeout(tPoll);const s=st.estado&&st.estado.sala;const vivo=s&&s.tipo==='vivo';const ms=!s?4000:s.estado==='fim'?20000:s.estado==='espera'?3000:(vivo&&s.modo==='classico')?2500:6000;tPoll=setTimeout(async()=>{await atualizar();agendar()},ms)}
async function atualizar(){if(!st.j)return;try{const r=await rpc('arena_estado',{p_id:st.id,p_j:st.j,p_tok:st.tok});semRede(false);if(r.erro==='jogador'){esquecer();return ecraCodigo('A tua ligação a esta sala terminou. Entra de novo.',st.code)}st.estado=r;aplicar(r)}catch(x){if(x.rede)semRede(true)}}
const off=()=>{const s=st.estado&&st.estado.sala;return s?new Date(s.agora).getTime()-st.recebido:0};
function aplicar(r){st.recebido=Date.now();const s=r.sala,eu=r.eu;st.off=new Date(s.agora).getTime()-Date.now();
  if(eu.expulso){esquecer();paraTudo();return ecra('exp',`${topo()}<div class="fb no"><div class="ic">🚪</div><h1>Saíste do jogo</h1><p class="mut">${MSG.expulso}</p><button class="btn sec" onclick="location.reload()">Voltar ao início</button></div>`)}
  let p=$('#pausa');if(s.estado==='pausa'&&!p){p=document.createElement('div');p.id='pausa';p.className='pausa';p.textContent='⏸ Em pausa';document.body.appendChild(p)}else if(s.estado!=='pausa'&&p)p.remove();
  if(eu.estado&&eu.estado.trocado&&eu.estado.trocado.em!==st.trocadoVisto){st.trocadoVisto=eu.estado.trocado.em;aviso('🔁 '+eu.estado.trocado.por+' trocou de pontos contigo!')}
  if(eu.estado&&eu.estado.atingido&&eu.estado.atingido.em!==st.atingidoVisto){const a=eu.estado.atingido;if(st.atingidoVisto!==undefined||Date.now()-new Date(a.em).getTime()<15000)aviso(a.como==='escudo'?'🛡️ O teu escudo travou o laser de '+a.por+'!':(a.como==='pirata'?'🏴‍☠️ ':a.como==='meteoro'?'☄️ ':'🎯 ')+a.por+' tirou-te '+AR.nf(a.v)+' pontos!');st.atingidoVisto=a.em}
  if(s.estado==='fim'||eu.terminou)return ecraFim(r);
  if(s.estado==='espera'&&s.tipo==='vivo')return ecraEspera(r);
  if(s.modo==='classico'&&s.tipo==='vivo')return classico(r);
  /* modos ao ritmo do aluno: só atualiza o painel, não interrompe a pergunta */
  if(!st.livre){st.livre=true;proxima()}else hud()}
function aviso(t){const d=document.createElement('div');d.className='lig';d.style.background='#1e3a8a';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),3500)}
function hud(){const r=st.estado;if(!r)return;const s=r.sala,eu=r.eu;const el=$('#hud');if(!el)return;const flo=s.modo==='floresta';
  el.innerHTML=`${AR.svg(eu.avatar,40)}<b>${esc(eu.alcunha)}</b><span class="sp"></span><span class="pill">${flo?'🌲 '+AR.arvores((eu.estado||{}).arv).inteiras:(s.modo==='pesca'?'🎣 ':s.modo==='corrida'?'🏁 ':'⭐ ')+AR.metrica(s.modo,eu.pontos)}</span>${s.modo==='colmeia'?`<span class="pill">🍯 ${AR.nf((eu.estado||{}).mel||0)}</span>`:''}${s.modo==='laser'&&(eu.estado||{}).escudo?'<span class="pill">🛡️</span>':''}<span class="pill">${eu.pos}.º/${eu.total}</span><span class="pill t" id="rel" ${tempoFim()==null?'hidden':''}></span>`;relogio()}
function tempoFim(){const s=st.estado.sala;if(s.tipo==='vivo'&&s.fim_em)return new Date(s.fim_em).getTime()-st.off;const ini=st.ini||(st.estado.eu.estado||{}).ini;const d=+((s.cfg||{}).duracao||0);if(s.tipo==='tpc'&&ini&&d&&s.modo!=='classico')return new Date(ini).getTime()+d*1000-st.off;return null}
function relogio(){clearInterval(tRel);const f=tempoFim();const el=$('#rel');if(f==null||!el)return;const t=()=>{const r=Math.max(0,(f-Date.now())/1000);const e=$('#rel');if(!e)return clearInterval(tRel);e.textContent='⏱ '+Math.floor(r/60)+':'+String(Math.floor(r%60)).padStart(2,'0');e.classList.toggle('pouco',r<=30);if(r<=0){clearInterval(tRel);setTimeout(atualizar,1500)}};t();tRel=setInterval(t,500)}

function ecraEspera(r){const eu=r.eu;if(ecraAtual==='espera'){const n=$('#njog');if(n)n.textContent=eu.total;return}
  ecra('espera',`${topo()}<div class="lob"><div class="av">${AR.svg(eu.avatar,150)}</div><h1>Estás dentro, ${esc(eu.alcunha)}!</h1><p class="mut">Olha para o quadro. O jogo começa já a seguir.</p><div class="dots"><span></span><span></span><span></span></div><p class="mut peq" style="margin-top:14px"><span id="njog">${eu.total}</span> jogadores na sala</p>
    <button class="btn sec" id="b-av" style="max-width:280px;margin:18px auto 0">Mudar de Pinha</button></div>`);
  $('#b-av').onclick=()=>ecraAvatares(()=>{ecraAtual='';ecraEspera(st.estado)})}
async function ecraAvatares(volta){let col=null;try{col=await rpc('arena_colecao',{p_id:st.id,p_j:st.j,p_tok:st.tok})}catch(_){}const tem=id=>AR.COMUNS.includes(id)||(col&&col.ativa&&col.pinhas&&col.pinhas[id]>0);
  ecra('av',`${topo()}<div class="card"><h2>Escolhe a tua Pinha</h2>${col&&col.ativa?'':'<p class="mut peq">As Pinhas raras desbloqueiam-se com moedas quando o professor usa a lista da turma.</p>'}<div class="avs">${AR.PINHAS.map(p=>`<button type="button" data-av="${p.id}" ${tem(p.id)?'':'disabled'} class="${st.estado.eu.avatar===p.id?'on':''}" title="${esc(p.nome)}">${AR.svg(p.id,56)}${p.rar!=='c'?`<small style="color:${AR.RAR[p.rar][1]}">${AR.RAR[p.rar][0][0]}</small>`:''}</button>`).join('')}</div><button class="btn sec" id="b-v">Voltar</button></div>`);
  document.querySelectorAll('[data-av]:not([disabled])').forEach(b=>b.onclick=async()=>{try{await rpc('arena_avatar',{p_id:st.id,p_j:st.j,p_tok:st.tok,p_avatar:b.dataset.av});st.estado.eu.avatar=b.dataset.av;AR.tocar('entra')}catch(_){}volta()});$('#b-v').onclick=volta}

/* ---------- Clássico ao vivo ---------- */
function classico(r){const s=r.sala,eu=r.eu,p=s.pergunta;if(!p)return ecraEspera(r);const chave='c'+s.atual+(s.revelada?'r':'')+(eu.resp?'x':'');
  if(s.revelada){if(ecraAtual===chave)return;const minha=eu.resp;const ok=minha&&minha.certa;if(ok){AR.tocar('certo');AR.vibrar([30,40,30])}else{AR.tocar('errado');AR.vibrar(200)}
    return ecra(chave,`${topo()}<div class="fb ${ok?'ok':'no'}"><div class="ic">${ok?'✅':minha?'❌':'⌛'}</div><h1>${ok?'Certo!':minha?'Não foi desta':'Não respondeste'}</h1>${ok?`<div class="pts">+${AR.nf(minha.pts)}</div>`:`<p class="mut">A certa era: <b>${esc((p.o||[])[s.certa]||'')}</b></p>`}<p style="margin-top:14px">Estás em <b>${eu.pos}.º lugar</b> de ${eu.total} · ${AR.nf(eu.pontos)} pontos</p>${top5(r)}</div>`)}
  if(eu.resp){if(ecraAtual===chave)return;return ecra(chave,`${topo()}<div class="fb"><div class="ic">🌰</div><h1>Resposta enviada!</h1><p class="mut">Espera pelos outros…</p><div class="dots"><span></span><span></span><span></span></div></div>`)}
  if(ecraAtual===chave)return;st.respAt=null;
  const t=+p.s||20;const ini=new Date(s.atual_ini).getTime()-st.off;
  ecra(chave,`${topo()}<div class="q"><div class="hud" id="hud"></div><div class="row"><span class="mut peq">Pergunta ${s.atual+1} de ${s.n_perg}</span><span class="sp" style="flex:1"></span><b id="cnt"></b></div><div class="bar"><i id="br"></i></div><div class="qt">${esc(p.t)}</div>${p.img?`<img class="qi" src="${p.img}" alt="">`:''}<div class="ops">${(p.o||[]).map((o,k)=>`<button type="button" class="op" style="--oc:${CORES[k]}" data-o="${k}"><span>${FORMAS[k]}</span>${esc(o)}</button>`).join('')}</div></div>`);hud();
  const tick=()=>{const rr=Math.max(0,t-(Date.now()-ini)/1000);const c=$('#cnt'),b=$('#br');if(!c)return clearInterval(st.tq);c.textContent=Math.ceil(rr)+' s';b.style.width=(100*rr/t)+'%';if(rr<=0){clearInterval(st.tq);document.querySelectorAll('.op').forEach(x=>x.disabled=true)}};clearInterval(st.tq);tick();st.tq=setInterval(tick,200);
  document.querySelectorAll('.op').forEach(b=>b.onclick=async()=>{if(ocupado)return;ocupado=true;const k=+b.dataset.o;document.querySelectorAll('.op').forEach(x=>{x.classList.toggle('esc',x===b);x.classList.toggle('sombra',x!==b)});AR.vibrar(20);
    try{const x=await rpc('arena_responder',{p_id:st.id,p_j:st.j,p_tok:st.tok,p_perg:s.atual,p_opc:k});if(x&&x.erro&&x.erro!=='repetida'&&x.erro!=='depressa'){aviso(x.erro==='tempo'||x.erro==='fora'?'O tempo acabou.':'Não foi possível enviar.')}
      st.estado.eu.resp={opc:k};clearInterval(st.tq);ecraAtual='';classico(st.estado)}catch(_){aviso('Sem ligação — tenta outra vez');document.querySelectorAll('.op').forEach(x=>x.classList.remove('esc','sombra'))}ocupado=false})}
function top5(r){return `<div class="top5">${(r.top||[]).map((x,k)=>`<div class="${x.id===st.j?'eu':''}"><b>${k+1}</b>${AR.svg(x.avatar,30)}<span>${esc(x.alcunha)}</span><em>${AR.metrica(r.sala.modo,x.pontos,x.arv)}</em></div>`).join('')}</div>`}

/* ---------- modos ao ritmo de cada aluno (Colheita, Floresta, trabalho de casa) ---------- */
async function proxima(){if(ocupado)return;ocupado=true;let q;try{q=await rpc('arena_pergunta',{p_id:st.id,p_j:st.j,p_tok:st.tok});semRede(false)}catch(x){ocupado=false;semRede(true);setTimeout(proxima,2500);return}ocupado=false;
  if(q.erro){if(q.erro==='terminou'||q.erro==='fim'||q.erro==='limite'){st.livre=false;return atualizar()}if(q.erro==='espera'||q.erro==='pausa'){st.livre=false;return setTimeout(atualizar,1500)}if(q.erro==='jogador'){esquecer();return ecraCodigo('A tua ligação a esta sala terminou. Entra de novo.',st.code)}return setTimeout(proxima,2000)}
  if(q.escolha)return escolher();if(q.ini)st.ini=q.ini;
  const p=q.pergunta,s=st.estado.sala;st.qAtual=q;
  ecra('q'+q.i+'-'+q.n,`${topo()}<div class="q"><div class="hud" id="hud"></div>${s.modo==='classico'?`<div class="mut peq">Pergunta ${q.n} de ${s.n_perg}</div>`:''}<div class="qt">${esc(p.t)}</div>${p.img?`<img class="qi" src="${p.img}" alt="">`:''}<div class="ops">${(p.o||[]).map((o,k)=>`<button type="button" class="op" style="--oc:${CORES[k]}" data-o="${k}"><span>${FORMAS[k]}</span>${esc(o)}</button>`).join('')}</div></div>`);hud();
  document.querySelectorAll('.op').forEach(b=>b.onclick=()=>responder(q,+b.dataset.o,b))}
async function responder(q,k,b){if(ocupado)return;ocupado=true;document.querySelectorAll('.op').forEach(x=>{x.classList.toggle('esc',x===b);x.classList.toggle('sombra',x!==b)});let x;
  try{x=await rpc('arena_responder',{p_id:st.id,p_j:st.j,p_tok:st.tok,p_perg:q.i,p_opc:k})}catch(_){ocupado=false;aviso('Sem ligação — tenta outra vez');document.querySelectorAll('.op').forEach(z=>z.classList.remove('esc','sombra'));return}ocupado=false;
  if(x.erro){if(x.erro==='depressa')return;if(x.erro==='fora')return proxima();st.livre=false;return atualizar()}
  const s=st.estado.sala;Object.assign(st.estado.eu,{pontos:x.pontos,moedas:x.moedas});if(x.arv!=null){st.estado.eu.estado=st.estado.eu.estado||{};st.estado.eu.estado.arv=x.arv}
  document.querySelectorAll('.op').forEach(z=>{const o=+z.dataset.o;z.classList.remove('esc','sombra');if(o===x.ci)z.classList.add('certa');else z.classList.add('sombra')});
  if(x.certa){AR.tocar('certo');AR.vibrar([30,40,30])}else{AR.tocar('errado');AR.vibrar(200)}
  await new Promise(r=>setTimeout(r,x.certa?650:1300));
  if(x.escolha&&AR.ESCOLHA.includes(s.modo))return escolher(x);
  if(s.modo==='pesca'){pescaFb(x,q);await new Promise(r=>setTimeout(r,x.certa?1500:1200))}
  else if(s.modo==='corrida'){corridaFb(x,q);await new Promise(r=>setTimeout(r,x.certa?1300:1100))}
  else if(s.modo==='floresta'){ecra('fb',`${topo()}<div class="q"><div class="hud" id="hud"></div><div class="fb ${x.certa?'ok':'no'}" style="padding:4px 0"><h1>${x.certa?(x.pts>10?'Rebento extra! 🌱':'A árvore cresceu!'):'Ups! A árvore não cresceu'}</h1><div class="flo">${AR.arvore(x.arv,260)}</div><p class="mut">${AR.arvores(x.arv).inteiras} ${AR.arvores(x.arv).inteiras===1?'árvore':'árvores'}${x.seq>=2&&x.certa?' · '+x.seq+' certas seguidas':''}</p></div></div>`);hud();if(x.certa)AR.tocar('cresce');await new Promise(r=>setTimeout(r,x.certa?1300:900))}
  else if(AR.ESCOLHA.includes(s.modo)&&!x.certa){ecra('fb',`${topo()}<div class="fb no"><div class="ic">❌</div><h1>Errado</h1><p class="mut">${s.modo==='colheita'?'Sem pinha desta vez.':'Sem prémio desta vez.'} A certa era: <b>${esc((q.pergunta.o||[])[x.ci]||'')}</b></p></div>`);await new Promise(r=>setTimeout(r,1200))}
  else if(s.modo==='classico'){ecra('fb',`${topo()}<div class="fb ${x.certa?'ok':'no'}"><div class="ic">${x.certa?'✅':'❌'}</div><h1>${x.certa?'Certo!':'Errado'}</h1>${x.certa?`<div class="pts">+${AR.nf(x.pts)}</div>`:`<p class="mut">A certa era: <b>${esc((q.pergunta.o||[])[x.ci]||'')}</b></p>`}</div>`);await new Promise(r=>setTimeout(r,1100))}
  if(x.fim){st.livre=false;return atualizar()}proxima()}
function colheitaEscolha(){const cores=['#a0632f','#8b5a2b','#b7793b'];
  ecra('colheita',`${topo()}<div class="q"><div class="hud" id="hud"></div><div class="centro"><h1>Escolhe uma pinha!</h1><p class="mut">Pode ter pontos, duplicar… ou uma surpresa menos boa.</p></div><div class="pinhas3">${[0,1,2].map(k=>`<button type="button" data-p="${k}" aria-label="Pinha ${k+1}">${AR.pinhaFechada(96,cores[k])}</button>`).join('')}</div><div id="efe"></div></div>`);hud();AR.tocar('pinha');
  document.querySelectorAll('.pinhas3 [data-p]').forEach(b=>b.onclick=async()=>{if(ocupado)return;ocupado=true;b.classList.add('abre');let x;try{x=await rpc('arena_acao',{p_id:st.id,p_j:st.j,p_tok:st.tok,p_escolha:+b.dataset.p})}catch(_){ocupado=false;b.classList.remove('abre');return aviso('Sem ligação — tenta outra vez')}ocupado=false;
    if(x.erro){return proxima()}const E=AR.EFEITOS[x.efeito]||['?','#fff'];const txt=x.efeito==='ganha'||x.efeito==='mega'?'+'+AR.nf(x.valor):x.efeito==='dobra'?'×2 (+'+AR.nf(x.valor)+')':x.efeito==='perde'?'−'+AR.nf(x.valor):x.efeito==='troca'?'com '+esc(x.com||''):'0';
    const outros=[...x.outros];document.querySelectorAll('.pinhas3 [data-p]').forEach(z=>{const ef=z===b?x.efeito:outros.shift();const e2=AR.EFEITOS[ef]||['',''];z.disabled=true;z.style.opacity=z===b?1:.45;z.insertAdjacentHTML('beforeend',`<div class="res" style="color:${e2[1]}">${esc(e2[0])}</div>`)});
    st.estado.eu.pontos=x.pontos;hud();$('#efe').innerHTML=`<div class="efeito" style="color:${E[1]}">${E[0]}<br>${txt}</div>`;
    if(x.efeito==='perde'||x.efeito==='vazia')AR.tocar('mau');else{AR.tocar('certo');if(x.efeito==='mega'||x.efeito==='dobra')AR.confetes(document.body,40)}AR.vibrar(40);
    setTimeout(proxima,1800)})}

/* ---------- v0.990 · modos novos: escolhas depois de uma resposta certa ---------- */
const ESC_CFG={
  garra:{tit:'Máquina da Garra',sub:'Escolhe onde a garra desce!',n:3,ic:['🧸','🎁','🧸'],cls:'garra'},
  mina:{tit:'Parte uma rocha!',sub:'Ouro, gemas, diamantes… ou dinamite.',n:9,ic:Array(9).fill('🪨'),cls:'mina'},
  estrelas:{tit:'Apanha uma estrela!',sub:'Pode ser uma supernova… ou um buraco negro.',n:3,ic:['⭐','🌟','✨'],cls:'ceu'},
  pirata:{tit:'Abre um cofre!',sub:'Cristais, duplicar, piratear um colega… ou o alarme.',n:3,ic:['🧰','🧰','🧰'],cls:'cofres'}
};
function escolher(x){const m=st.estado.sala.modo;if(m==='colheita')return colheitaEscolha();if(m==='laser')return laserEscolha();if(m==='colmeia')return colmeiaEscolha(x);return escolhaGen(m)}
function efTxt(m,x){const E=(AR.EF2[m]||{})[x.efeito]||['?','#fff','❔'];const neg=['dinamite','buraco','alarme'].includes(x.efeito);
  const v=x.valor?((neg?'−':'+')+AR.nf(x.valor)):'';const com=x.com?(x.efeito==='bloqueado'?' (escudo de '+esc(x.com)+')':' — '+esc(x.com)):'';if(m==='colmeia'&&(x.efeito==='abelha'||x.efeito==='flor'))return {E,txt:'agora '+AR.nf(10*(+x.abelhas||1)*(1+(+x.flores||0)))+' de mel por certa',neg};return {E,txt:(v||(x.efeito==='escudo'?'protegido do próximo disparo':'0'))+com,neg}}
function mostraEf(m,x){const {E,txt,neg}=efTxt(m,x);st.estado.eu.pontos=x.pontos;hud();const el=$('#efe');if(el)el.innerHTML=`<div class="efeito" style="color:${E[1]}"><span class="efic">${E[2]}</span><br>${esc(E[0])}<br><small>${txt}</small></div>`;
  if(neg||x.efeito==='falha'||x.efeito==='nada'||x.efeito==='vazio'||x.efeito==='pedra')AR.tocar(x.efeito==='dinamite'?'explode':x.efeito==='pedra'?'pedra':'mau');
  else{AR.tocar(m==='mina'?'gema':m==='garra'?'garra':m==='laser'?(x.efeito==='escudo'||x.efeito==='bloqueado'?'escudo':'zap'):'certo');if(['dourado','supernova','diamante','dobra','piratear','acerto'].includes(x.efeito))AR.confetes(document.body,46)}AR.vibrar(neg?[60,40,120]:40)}
async function acao2(esc_,alvo){let x;try{x=await rpc('arena_acao2',{p_id:st.id,p_j:st.j,p_tok:st.tok,p_escolha:esc_,p_alvo:alvo||null})}catch(_){aviso('Sem ligação — tenta outra vez');return null}
  if(x&&x.erro){if(x.erro==='fim'){st.livre=false;atualizar()}else proxima();return null}return x}
function escolhaGen(m){const C=ESC_CFG[m];
  ecra('esc-'+m,`${topo()}<div class="q"><div class="hud" id="hud"></div><div class="centro"><h1>${C.tit}</h1><p class="mut">${C.sub}</p></div>
    <div class="esc ${C.cls}" style="--n:${C.n===9?3:3}">${C.ic.map((ic,k)=>`<button type="button" data-e="${k}" aria-label="Opção ${k+1}"><span class="eic">${ic}</span>${m==='garra'?'<i class="claw">🪝</i>':''}</button>`).join('')}</div><div id="efe"></div></div>`);hud();AR.tocar('pinha');
  document.querySelectorAll('.esc [data-e]').forEach(b=>b.onclick=async()=>{if(ocupado)return;ocupado=true;b.classList.add('abre');const x=await acao2(+b.dataset.e);ocupado=false;if(!x){b.classList.remove('abre');return}
    const outros=[...(x.outros||[])];document.querySelectorAll('.esc [data-e]').forEach(z=>{const ef=z===b?x.efeito:outros.shift();const e2=(AR.EF2[m]||{})[ef];z.disabled=true;z.classList.toggle('esc-eu',z===b);z.style.opacity=z===b?1:.5;
      if(e2){z.querySelector('.eic').textContent=e2[2];z.insertAdjacentHTML('beforeend',`<div class="res" style="color:${e2[1]}">${esc(e2[0])}</div>`)}});
    mostraEf(m,x);setTimeout(proxima,2000)})}
function laserEscolha(){const r=st.estado;const alvos=(r.top||[]).filter(t=>t.id!==st.j).slice(0,5);const tpc=r.sala.tipo==='tpc';const eu=r.eu||{};const esc0=(eu.estado||{}).escudo;
  ecra('laser',`${topo()}<div class="q"><div class="hud" id="hud"></div><div class="centro"><h1>Laser carregado! ⚡</h1><p class="mut">O que fazes com a energia?</p></div>
    <div class="lasops"><button type="button" class="lasb dis" data-l="0" ${tpc||!alvos.length?'disabled':''}><span>🎯</span><b>Disparar</b><small>Rouba 15 % dos pontos a um dos primeiros</small></button>
      <button type="button" class="lasb esc_" data-l="1" ${esc0?'disabled':''}><span>🛡️</span><b>Escudo</b><small>${esc0?'Já tens escudo ligado':'Bloqueia o próximo disparo contra ti'}</small></button>
      <button type="button" class="lasb car" data-l="2"><span>🔋</span><b>Recolher energia</b><small>+40 a +70 pontos</small></button></div>
    <div id="alvos" hidden><p class="mut centro">Escolhe o alvo:</p><div class="alvos">${alvos.map(t=>`<button type="button" data-a="${esc(t.id)}">${AR.svg(t.avatar,44)}<b>${esc(t.alcunha)}</b><em>${AR.nf(t.pontos)}</em></button>`).join('')}</div></div><div id="efe"></div></div>`);hud();AR.tocar('escudo');
  const faz=async(k,alvo)=>{if(ocupado)return;ocupado=true;document.querySelectorAll('.lasb,.alvos button').forEach(z=>z.disabled=true);const x=await acao2(k,alvo);ocupado=false;if(!x)return;
    if(x.escudo){st.estado.eu.estado=st.estado.eu.estado||{};st.estado.eu.estado.escudo=true}if(x.efeito==='acerto'||x.efeito==='bloqueado'){const t=document.querySelector(`.alvos [data-a="${CSS.escape(alvo||'')}"]`);if(t)t.classList.add(x.efeito==='acerto'?'zap':'bloq')}
    mostraEf('laser',x);setTimeout(proxima,1900)};
  document.querySelectorAll('.lasb').forEach(b=>b.onclick=()=>{const k=+b.dataset.l;if(k===0){$('#alvos').hidden=false;document.querySelectorAll('.lasb').forEach(z=>z.classList.toggle('sombra',z!==b));return}faz(k)});
  document.querySelectorAll('.alvos [data-a]').forEach(b=>b.onclick=()=>faz(0,b.dataset.a))}
function colmeiaEscolha(x){const e=Object.assign({},(st.estado.eu.estado||{}),x||{});const mel=+e.mel||0,ab=+e.abelhas||1,fl=+e.flores||0;const prod=10*ab*(1+fl);
  ecra('colmeia',`${topo()}<div class="q"><div class="hud" id="hud"></div><div class="col-h"><div class="favo">🍯<b>${AR.nf(mel)}</b><small>mel na colmeia</small></div><div class="favo">🐝<b>${ab}</b><small>abelhas</small></div><div class="favo">🌸<b>${fl}</b><small>flores</small></div></div>
    <p class="mut centro">Cada resposta certa traz <b>${AR.nf(prod)}</b> de mel. O mel só conta quando o vendes!</p>
    <div class="lasops"><button type="button" class="lasb" data-c="0"><span>🐝</span><b>+1 abelha</b><small>passas a ${AR.nf(10*(ab+1)*(1+fl))} por certa</small></button><button type="button" class="lasb" data-c="1"><span>🌸</span><b>+1 flor</b><small>passas a ${AR.nf(10*ab*(2+fl))} por certa</small></button><button type="button" class="lasb car" data-c="2" ${mel?'':'disabled'}><span>🍯</span><b>Vender o mel</b><small>+${AR.nf(mel)} pontos</small></button></div><div id="efe"></div></div>`);hud();AR.tocar('mel');
  document.querySelectorAll('[data-c]').forEach(b=>b.onclick=async()=>{if(ocupado)return;ocupado=true;document.querySelectorAll('[data-c]').forEach(z=>z.disabled=true);const r=await acao2(+b.dataset.c);ocupado=false;if(!r)return;
    st.estado.eu.estado=Object.assign(st.estado.eu.estado||{},{mel:r.mel,abelhas:r.abelhas,flores:r.flores});mostraEf('colmeia',r);if(r.efeito==='venda')AR.confetes(document.body,30);setTimeout(proxima,1500)})}
function pescaFb(x,q){const P=AR.PEIXES[x.peixe]||['Peixe','🐟','#0284c7'];
  ecra('fb',`${topo()}<div class="q"><div class="hud" id="hud"></div><div class="fb ${x.certa?'ok':'no'} lago">${x.certa?`<div class="ic peixe" style="--pc:${P[2]}">${P[1]}</div><h1>${x.peixe==='bota'?'Ups… uma bota velha!':esc(P[0])+'!'}</h1>${x.kg?`<div class="pts">+${AR.metrica('pesca',x.kg)}</div>`:''}${x.seq>0&&x.seq%5===0?'<p class="mut">Isco duplo! 🪱×2</p>':''}`:`<div class="ic">🎣</div><h1>O peixe fugiu!</h1><p class="mut">A certa era: <b>${esc((q.pergunta.o||[])[x.ci]||'')}</b></p>`}<p class="mut">Total: ${AR.metrica('pesca',x.pontos)}</p></div></div>`);hud();
  if(x.certa){AR.tocar(x.peixe==='baleia'||x.peixe==='atum'?'gema':'peixe');if(x.peixe==='baleia'||x.peixe==='atum')AR.confetes(document.body,50)}}
function corridaFb(x,q){const s=st.estado.sala;const obj=+(s.cfg||{}).objetivo||0;const top=(st.estado.top||[]);const lider=Math.max(x.pontos||0,...top.map(t=>+t.pontos||0),1);const meta=Math.max(obj||lider+5,x.pontos||0,1);
  const pista=[{id:st.j,avatar:st.estado.eu.avatar,alcunha:st.estado.eu.alcunha,pontos:x.pontos},...top.filter(t=>t.id!==st.j).slice(0,3)];
  ecra('fb',`${topo()}<div class="q"><div class="hud" id="hud"></div><div class="fb ${x.certa?'ok':'no'}" style="padding:6px 0"><h1>${x.certa?(x.pts>1?'Turbo! +2 🚀':'+1 casa!'):'Ficaste parado…'}</h1>${x.certa?'':`<p class="mut">A certa era: <b>${esc((q.pergunta.o||[])[x.ci]||'')}</b></p>`}
    <div class="pista">${pista.map(t=>`<div class="faixa ${t.id===st.j?'eu':''}"><span class="lin"></span><span class="car" style="left:${Math.min(96,100*(+t.pontos||0)/meta)}%">${AR.svg(t.avatar,36)}</span><b>${esc(t.alcunha)}</b></div>`).join('')}<span class="meta">🏁</span></div>
    <p class="mut">${AR.metrica('corrida',x.pontos)}${obj?' de '+obj:''}</p></div></div>`);hud();if(x.certa)AR.tocar(x.pts>1?'turbo':'passo')}

/* ---------- fim + coleção de Pinhas ---------- */
async function ecraFim(r){if(ecraAtual==='fim')return;paraTudo();st.livre=false;const s=r.sala,eu=r.eu;AR.tocar('fim');let col=null;try{col=await rpc('arena_colecao',{p_id:st.id,p_j:st.j,p_tok:st.tok})}catch(_){}
  ecra('fim',`${topo()}<div class="fim"><div style="margin:8px 0">${AR.svg(eu.avatar,120)}</div><div class="pos">${eu.pos}.º</div><p class="mut">de ${eu.total} jogadores</p><h1>${s.estado==='fim'?'Fim do jogo!':'Terminaste!'}</h1>
    <p style="font-size:20px"><b>${s.modo==='floresta'?AR.arvores((eu.estado||{}).arv).inteiras+' árvores 🌲':['pesca','corrida'].includes(s.modo)?AR.metrica(s.modo,eu.pontos):AR.nf(eu.pontos)+' pontos'}</b> · ${eu.certas} certas · ${eu.erradas} erradas</p>${top5(r)}
    ${col&&col.ativa?`<button class="btn ouro" id="b-col">🪙 ${col.moedas} moedas · Abrir a coleção</button>`:col&&col.moedas_jogo?`<p class="mut peq" style="margin-top:12px">Ganhaste ${col.moedas_jogo} moedas neste jogo.</p>`:''}<button class="btn sec" id="b-sai">Sair</button></div>`);
  if(eu.pos<=3)AR.confetes(document.body,70);const bc=$('#b-col');if(bc)bc.onclick=()=>ecraColecao();$('#b-sai').onclick=()=>{esquecer();location.hash='';location.reload()}}
async function ecraColecao(novo){let c;try{c=await rpc('arena_colecao',{p_id:st.id,p_j:st.j,p_tok:st.tok})}catch(x){return aviso(x.message)}const P=c.pinhas||{};const n=Object.keys(P).length;
  const SAC=[['bosque','Saco do Bosque',20,'#15803d','🌲'],['serra','Saco da Serra',45,'#0369a1','⛰️'],['cume','Saco do Cume',90,'#7c3aed','🏔️']];
  ecra('col',`${topo()}<div class="card"><div class="row"><h2 style="margin:0;flex:1">A tua coleção</h2><b style="font-size:20px">🪙 ${c.moedas}</b></div><p class="mut peq">${n} de ${AR.PINHAS.length} Pinhas · ganha moedas a jogar com a lista da turma</p>
    ${novo?`<div class="novo">${AR.svg(novo.pinha,150)}<div class="nm">${esc(AR.pinha(novo.pinha).nome)}</div><span class="rar" style="background:${AR.RAR[novo.rar][1]}">${AR.RAR[novo.rar][0]}</span></div>`:''}
    <div class="sacos">${SAC.map(([k,nm,pr,cor,ic])=>`<button type="button" data-s="${k}" style="--sc:${cor}" ${c.moedas<pr?'disabled':''}><i>${ic}</i><b>${nm}</b><span>🪙 ${pr}</span></button>`).join('')}</div>
    <div class="avs">${AR.PINHAS.map(p=>`<button type="button" data-av="${p.id}" ${P[p.id]||p.rar==='c'?'':'disabled'} class="${st.estado&&st.estado.eu.avatar===p.id?'on':''}" title="${esc(p.nome)} · ${AR.RAR[p.rar][0]}">${AR.svg(p.id,56)}${P[p.id]?`<small>×${P[p.id]}</small>`:''}</button>`).join('')}</div><p class="mut peq">Toca numa Pinha que tenhas para a usares como avatar.</p><button class="btn sec" id="b-v">Voltar</button></div>`);
  if(novo){AR.tocar('fim');AR.confetes(document.body,novo.rar==='l'||novo.rar==='m'?120:50)}
  document.querySelectorAll('[data-s]').forEach(b=>b.onclick=async()=>{if(ocupado)return;ocupado=true;b.disabled=true;try{const x=await rpc('arena_saco',{p_id:st.id,p_j:st.j,p_tok:st.tok,p_saco:b.dataset.s});ocupado=false;if(x.erro)return aviso(x.erro==='moedas'?'Não tens moedas suficientes.':'Não foi possível abrir.');AR.tocar('pinha');ecraColecao(x)}catch(e){ocupado=false;aviso(e.message)}});
  document.querySelectorAll('.avs [data-av]:not([disabled])').forEach(b=>b.onclick=async()=>{try{await rpc('arena_avatar',{p_id:st.id,p_j:st.j,p_tok:st.tok,p_avatar:b.dataset.av});if(st.estado)st.estado.eu.avatar=b.dataset.av;aviso('Nova Pinha escolhida!');ecraColecao()}catch(_){}});
  $('#b-v').onclick=()=>{ecraAtual='';ecraFim(st.estado)}}

document.addEventListener('visibilitychange',()=>{if(!document.hidden&&st.j){atualizar();if(st.livre&&!ocupado&&ecraAtual.startsWith('q')===false&&ecraAtual!=='colheita'&&ecraAtual!=='fb')proxima()}});
addEventListener('online',()=>{semRede(false);if(st.j)atualizar()});
const h=AR.limpaCod(decodeURIComponent(location.hash.slice(1)));ecraCodigo('',h);if(h.length===6)abrir(h);
})();
</script>
